# Site Configuration
title: Christian Hatch
description: iOS/Android/full stack web developer. I make apps, open source goodies, and I'm passionate about making clean, simple, and trustworthy products.
author: Christian Hatch
url: https://chatch.me
baseurl: ""

# GitHub Pages Configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from processing
exclude:
  - docs/          # design notes, not part of the published site
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
